<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shuttle Trip Log</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#111827;--mut:#6b7280;--line:#d1d5db;--ac:#1d4ed8;--acx:#fff;--ok:#047857;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#f3f4f6;--mut:#9ca3af;--line:#374151;--ac:#3b82f6;--acx:#fff;--ok:#34d399}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#f3f4f6;--mut:#9ca3af;--line:#374151;--ac:#3b82f6;--acx:#fff;--ok:#34d399}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px;max-width:520px;margin:0 auto}
h1{font-size:18px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:4px;letter-spacing:.04em}
input{width:100%;font-size:18px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx)}
.trip{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.trip:first-child{border-top:0}
.n{width:22px;color:var(--mut);font-size:13px}
.info{flex:1}
.time{font-weight:700;font-size:16px}
.route{font-size:13px;color:var(--mut)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;font-size:24px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.step button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.step input{width:58px;text-align:center;font-weight:700;padding:8px 2px}
.tot{display:flex;justify-content:space-between;font-size:17px;font-weight:700;padding:4px 0}
.tot span:last-child{color:var(--ok)}
.sticky{position:sticky;top:8px;z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.25)}
textarea{width:100%;font-size:13px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font-family:ui-monospace,Menlo,monospace}
.send{width:100%;margin-top:8px;padding:14px;font-size:16px;font-weight:700;border-radius:10px;border:0;background:var(--ac);color:var(--acx)}
.reset{width:100%;padding:12px;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
</style>
</head>
<body>
<div style="display:flex;gap:8px;margin-bottom:8px"><a href="index.html" style="flex:1;text-align:center;padding:8px;border-radius:8px;border:1px solid var(--line);color:var(--tx);text-decoration:none;font-weight:700;">PM</a><a href="am.html" style="flex:1;text-align:center;padding:8px;border-radius:8px;border:1px solid var(--line);color:var(--tx);text-decoration:none;font-weight:700;background:var(--ac);color:var(--acx);border-color:var(--ac)">AM</a></div>
<h1>Shuttle Trip Log</h1>
<div class="sub">Van 2 / PITX &middot; AM Shift (5:00AM&ndash;5:00PM)</div>

<div class="card grid">
  <div class="full"><label>DATE</label><input type="date" id="date"></div>
  <div><label>ODO IN</label><input type="number" inputmode="numeric" id="oin" placeholder="0"></div>
  <div><label>ODO OUT</label><input type="number" inputmode="numeric" id="oout" placeholder="0"></div>
</div>

<div class="card sticky" id="previewCard"><label>I-SEND SA PARTNER</label><textarea id="out" readonly rows="6"></textarea><button class="send" id="send">I-send / Kopyahin</button></div>

<div class="card" id="trips">
<div class="trip"><div class="n">1</div><div class="info"><div class="time">5:15 AM</div><div class="route">NEO → PITX</div></div><div class="step"><button data-i="0" data-d="-1">&minus;</button><input type="number" inputmode="numeric" min="0" id="p0" placeholder="0"><button class="p" data-i="0" data-d="1">+</button></div></div>
<div class="trip"><div class="n">2</div><div class="info"><div class="time">7:15 AM</div><div class="route">NEO → PITX</div></div><div class="step"><button data-i="1" data-d="-1">&minus;</button><input type="number" inputmode="numeric" min="0" id="p1" placeholder="0"><button class="p" data-i="1" data-d="1">+</button></div></div>
<div class="trip"><div class="n">3</div><div class="info"><div class="time">8:30 AM</div><div class="route">PITX → NEO</div></div><div class="step"><button data-i="2" data-d="-1">&minus;</button><input type="number" inputmode="numeric" min="0" id="p2" placeholder="0"><button class="p" data-i="2" data-d="1">+</button></div></div>
<div class="trip"><div class="n">4</div><div class="info"><div class="time">9:45 AM</div><div class="route">NEO → PITX</div></div><div class="step"><button data-i="3" data-d="-1">&minus;</button><input type="number" inputmode="numeric" min="0" id="p3" placeholder="0"><button class="p" data-i="3" data-d="1">+</button></div></div>
<div class="trip"><div class="n">5</div><div class="info"><div class="time">11:00 AM</div><div class="route">PITX → NEO</div></div><div class="step"><button data-i="4" data-d="-1">&minus;</button><input type="number" inputmode="numeric" min="0" id="p4" placeholder="0"><button class="p" data-i="4" data-d="1">+</button></div></div>
<div class="trip"><div class="n">6</div><div class="info"><div class="time">1:15 PM</div><div class="route">NEO → PITX</div></div><div class="step"><button data-i="5" data-d="-1">&minus;</button><input type="number" inputmode="numeric" min="0" id="p5" placeholder="0"><button class="p" data-i="5" data-d="1">+</button></div></div>
<div class="trip"><div class="n">7</div><div class="info"><div class="time">3:00 PM</div><div class="route">PITX → NEO</div></div><div class="step"><button data-i="6" data-d="-1">&minus;</button><input type="number" inputmode="numeric" min="0" id="p6" placeholder="0"><button class="p" data-i="6" data-d="1">+</button></div></div>
</div>

<button class="reset" id="newday">Bagong Araw (pumunta sa ngayon)</button>
<button class="reset" id="reset" style="margin-top:8px">I-clear ang petsang ito</button>

<script>
var TRIPS=[["5:15 AM","NEO → PITX"],["7:15 AM","NEO → PITX"],["8:30 AM","PITX → NEO"],["9:45 AM","NEO → PITX"],["11:00 AM","PITX → NEO"],["1:15 PM","NEO → PITX"],["3:00 PM","PITX → NEO"]];
var KEY="shuttle-trip-log-am";
function blank(d){return {date:d,oin:"",oout:"",pax:TRIPS.map(function(){return ""})};}
var DBKEY=KEY+"-bydate",DB={},S;
try{var raw=localStorage.getItem(DBKEY);if(raw)DB=JSON.parse(raw)||{};}catch(e){}
try{if(!Object.keys(DB).length){var old=localStorage.getItem(KEY);if(old){var o=JSON.parse(old);if(o&&o.date&&o.pax&&o.pax.length===TRIPS.length)DB[o.date]={oin:o.oin||"",oout:o.oout||"",pax:o.pax};}}}catch(e){}
function persist(){try{localStorage.setItem(DBKEY,JSON.stringify(DB));}catch(e){}}
function save(){if(S.date){DB[S.date]={oin:S.oin,oout:S.oout,pax:S.pax};}persist();}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function load(d){var r=DB[d];S=(r&&r.pax&&r.pax.length===TRIPS.length)?{date:d,oin:r.oin||"",oout:r.oout||"",pax:r.pax.slice()}:blank(d);}
load(today());

var box=document.getElementById("trips");


function calc(){
  summ();
}
function summ(){
  var a=parseFloat(S.oin),b=parseFloat(S.oout);
  var km=(isNaN(a)||isNaN(b))?"-":Math.round((b-a)*10)/10;
  var t=0;S.pax.forEach(function(v){t+=parseInt(v)||0;});
  var L=["SHUTTLE TRIP LOG",document.querySelector(".sub").textContent,"Date: "+(S.date||"-"),"Odo In: "+(S.oin||"-"),"Odo Out: "+(S.oout||"-"),""];
  TRIPS.forEach(function(x,i){L.push((i+1)+". "+x[0]+" "+x[1]+" - "+(S.pax[i]||0)+" pax");});
  
  document.getElementById("out").value=L.join("\n");
}
document.getElementById("send").addEventListener("click",function(){
  var btn=this,o=document.getElementById("out"),txt=o.value;
  function done(){btn.textContent="Na-kopya! I-paste sa Messenger/Viber";setTimeout(function(){btn.textContent="I-send / Kopyahin";},3000);}
  function fb(){try{o.removeAttribute("readonly");o.focus();o.select();document.execCommand("copy");o.setAttribute("readonly","");done();}catch(e){}}
  if(navigator.share){navigator.share({text:txt}).catch(function(){});return;}
  try{navigator.clipboard.writeText(txt).then(done,fb);}catch(e){fb();}
});
function render(){
  document.getElementById("date").value=S.date;
  document.getElementById("oin").value=S.oin;
  document.getElementById("oout").value=S.oout;
  S.pax.forEach(function(v,i){document.getElementById("p"+i).value=v;});
  calc();
}
["oin","oout"].forEach(function(id){
  document.getElementById(id).addEventListener("input",function(e){S[id]=e.target.value;save();calc();});
});
document.getElementById("date").addEventListener("change",function(e){
  if(!e.target.value){e.target.value=S.date;return;}
  save();load(e.target.value);render();
});
S.pax.forEach(function(_,i){
  document.getElementById("p"+i).addEventListener("input",function(e){S.pax[i]=e.target.value;save();calc();});
});
box.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var i=+b.dataset.i,d=+b.dataset.d;
  var n=Math.max(0,(parseInt(S.pax[i])||0)+d);
  S.pax[i]=String(n);document.getElementById("p"+i).value=n;save();calc();
});
document.getElementById("newday").addEventListener("click",function(){
  save();load(today());render();
});
document.getElementById("reset").addEventListener("click",function(){
  if(!confirm("I-clear ang laman ng petsang ito?"))return;
  delete DB[S.date];persist();load(S.date);render();
});
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script>
</body>
</html>
